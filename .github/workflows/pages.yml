name: Pubblica To Do
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Configura PWA iPhone v11
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'<link rel="manifest"[^>]*>',
                     '<link rel="manifest" href="/To-Do/manifest.webmanifest?v=11">', s, count=1)
          s = re.sub(r'<link rel="icon" sizes="180x180"[^>]*>',
                     '<link rel="icon" sizes="180x180" href="/To-Do/apple-touch-icon.png?v=11" type="image/png">', s, count=1)
          s = re.sub(r'<link rel="apple-touch-icon"[^>]*>',
                     '<link rel="apple-touch-icon" sizes="180x180" href="/To-Do/apple-touch-icon.png?v=11">', s, count=1)
          s = re.sub(r'<link rel="icon" sizes="192x192"[^>]*>',
                     '<link rel="icon" sizes="192x192" href="/To-Do/icon-192.png?v=11" type="image/png">', s, count=1)
          s = re.sub(r'\s*<link rel="icon" sizes="512x512"[^>]*>', '', s, count=1)

          if 'apple-touch-icon-precomposed' not in s:
              marker = '<link rel="apple-touch-icon" sizes="180x180" href="/To-Do/apple-touch-icon.png?v=11">'
              s = s.replace(marker, marker + '\n  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/To-Do/apple-touch-icon-precomposed.png?v=11">', 1)

          p.write_text(s, encoding='utf-8')

          Path('manifest.webmanifest').write_text('''{
            "id": "/To-Do/note-v11",
            "name": "Note",
            "short_name": "Note",
            "start_url": "/To-Do/?note=11",
            "scope": "/To-Do/",
            "display": "standalone",
            "background_color": "#edf4fb",
            "theme_color": "#edf4fb",
            "icons": [
              {"src":"/To-Do/icon-192.png?v=11","sizes":"192x192","type":"image/png","purpose":"any"}
            ]
          }
          ''', encoding='utf-8')
          PY
      - name: Carica sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
