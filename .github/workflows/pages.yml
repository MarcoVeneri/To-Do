name: Pubblica To Do
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Installa Pillow
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Genera icone PWA v12
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFilter

          S = 1024
          img = Image.new('RGB', (S, S), '#91ccff')
          px = img.load()

          # sfondo azzurro/blu che riempie tutto il quadrato
          for y in range(S):
              for x in range(S):
                  t = (x + y) / (2*(S-1))
                  r = int(220*(1-t) + 82*t)
                  g = int(243*(1-t) + 169*t)
                  b = int(255*(1-t) + 246*t)
                  px[x,y] = (r,g,b)

          # riflesso morbido
          glow = Image.new('RGBA', (S,S), (0,0,0,0))
          gd = ImageDraw.Draw(glow)
          gd.ellipse((-180,-260,850,520), fill=(255,255,255,85))
          glow = glow.filter(ImageFilter.GaussianBlur(45))
          img = Image.alpha_composite(img.convert('RGBA'), glow)

          d = ImageDraw.Draw(img)

          # riquadro centrale bianco con bordo blu spesso
          outer = (142, 92, 882, 920)
          radius = 150
          d.rounded_rectangle(outer, radius=radius, fill=(30,132,245,255))
          inner = (198, 148, 826, 864)
          d.rounded_rectangle(inner, radius=112, fill=(255,255,255,255))

          blue = (28,127,242,255)

          # spunta grande
          d.line((300, 450, 385, 535), fill=blue, width=62)
          d.line((385, 535, 560, 335), fill=blue, width=62)

          # trattino a destra
          d.rounded_rectangle((602, 452, 758, 512), radius=28, fill=blue)

          # linea orizzontale in basso
          d.rounded_rectangle((285, 640, 755, 700), radius=28, fill=blue)

          # sottile luce interna
          hi = Image.new('RGBA', (S,S), (0,0,0,0))
          hd = ImageDraw.Draw(hi)
          hd.arc((25,25,999,999), 205, 335, fill=(255,255,255,70), width=22)
          img = Image.alpha_composite(img, hi).convert('RGB')

          for size, name in [
              (180, 'note-icon-180-v12.png'),
              (192, 'note-icon-192-v12.png'),
              (512, 'note-icon-512-v12.png')]:
              out = img.resize((size,size), Image.Resampling.LANCZOS)
              out.save(name, 'PNG', optimize=True)

          # nomi standard, utili anche come fallback Safari
          img.resize((180,180), Image.Resampling.LANCZOS).save('apple-touch-icon.png', 'PNG', optimize=True)
          img.resize((180,180), Image.Resampling.LANCZOS).save('apple-touch-icon-precomposed.png', 'PNG', optimize=True)

          # verifica reale: se un PNG è corrotto il workflow fallisce qui
          for name, expected in [
              ('note-icon-180-v12.png',(180,180)),
              ('note-icon-192-v12.png',(192,192)),
              ('note-icon-512-v12.png',(512,512)),
              ('apple-touch-icon.png',(180,180))]:
              chk = Image.open(name)
              chk.load()
              assert chk.size == expected
              assert chk.format == 'PNG'
              print('OK', name, chk.size, chk.mode)
          PY

      - name: Configura PWA iPhone v12
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = re.sub(r'<link rel="manifest"[^>]*>',
                     '<link rel="manifest" href="/To-Do/manifest.webmanifest?v=12">', s, count=1)
          s = re.sub(r'<link rel="icon" sizes="180x180"[^>]*>',
                     '<link rel="icon" sizes="180x180" href="/To-Do/note-icon-180-v12.png" type="image/png">', s, count=1)
          s = re.sub(r'<link rel="apple-touch-icon"[^>]*>',
                     '<link rel="apple-touch-icon" sizes="180x180" href="/To-Do/note-icon-180-v12.png">', s, count=1)
          s = re.sub(r'<link rel="icon" sizes="192x192"[^>]*>',
                     '<link rel="icon" sizes="192x192" href="/To-Do/note-icon-192-v12.png" type="image/png">', s, count=1)
          s = re.sub(r'\s*<link rel="icon" sizes="512x512"[^>]*>', '', s, count=1)

          if 'apple-touch-icon-precomposed' not in s:
              marker = '<link rel="apple-touch-icon" sizes="180x180" href="/To-Do/note-icon-180-v12.png">'
              s = s.replace(marker, marker + '\n  <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/To-Do/note-icon-180-v12.png">', 1)

          p.write_text(s, encoding='utf-8')

          Path('manifest.webmanifest').write_text('''{
            "id": "/To-Do/note-v12",
            "name": "Note",
            "short_name": "Note",
            "start_url": "/To-Do/?note=12",
            "scope": "/To-Do/",
            "display": "standalone",
            "background_color": "#9fd5ff",
            "theme_color": "#6eb7fb",
            "icons": [
              {"src":"/To-Do/note-icon-192-v12.png","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"/To-Do/note-icon-512-v12.png","sizes":"512x512","type":"image/png","purpose":"any"}
            ]
          }
          ''', encoding='utf-8')
          PY

      - name: Carica sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
