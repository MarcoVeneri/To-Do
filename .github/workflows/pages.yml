name: Pubblica To Do
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: "pages"
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Installa Pillow
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Crea app iPhone v13 con icone locali verificate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import re

          outdir = Path('app-v13')
          outdir.mkdir(exist_ok=True)

          # Icona piena, RGB, senza trasparenza: pensata per riempire tutto il quadrato iOS.
          S = 1024
          img = Image.new('RGB', (S, S), (92, 177, 250))
          px = img.load()
          for y in range(S):
              for x in range(S):
                  t = (0.58*x + 0.42*y) / (S-1)
                  t = max(0, min(1, t))
                  px[x, y] = (
                      int(175*(1-t) + 70*t),
                      int(222*(1-t) + 153*t),
                      int(255*(1-t) + 244*t)
                  )

          d = ImageDraw.Draw(img)
          blue = (29, 126, 243)
          # pannello bianco grande, con bordo blu, senza margini inutili
          d.rounded_rectangle((118, 82, 906, 942), radius=170, fill=blue)
          d.rounded_rectangle((174, 138, 850, 886), radius=120, fill=(255, 255, 255))
          # spunta
          d.line((285, 445, 390, 550), fill=blue, width=66)
          d.line((390, 550, 585, 326), fill=blue, width=66)
          # trattino a destra
          d.rounded_rectangle((626, 456, 775, 516), radius=30, fill=blue)
          # riga bassa
          d.rounded_rectangle((280, 655, 770, 719), radius=32, fill=blue)

          files = [
              (180, outdir/'apple-touch-icon.png'),
              (180, outdir/'apple-touch-icon-precomposed.png'),
              (192, outdir/'icon-192.png'),
              (512, outdir/'icon-512.png'),
          ]
          for size, path in files:
              img.resize((size,size), Image.Resampling.LANCZOS).save(path, 'PNG', optimize=True)

          # favicon classico come ulteriore fallback
          img.resize((256,256), Image.Resampling.LANCZOS).save(
              outdir/'favicon.ico', format='ICO', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)]
          )

          # Verifica reale dei PNG prodotti.
          for size, path in files:
              chk = Image.open(path)
              chk.load()
              assert chk.format == 'PNG'
              assert chk.mode == 'RGB'
              assert chk.size == (size, size)
              print('ICON OK', path, chk.size, chk.mode)

          # Pagina su percorso nuovo, ma usa gli stessi CSS/JS/dati della PWA originale.
          source = Path('index.html').read_text(encoding='utf-8')
          source = source.replace('<head>', '<head>\n  <base href="/To-Do/">', 1)
          source = re.sub(r'\s*<link rel="manifest"[^>]*>', '', source)
          source = re.sub(r'\s*<link rel="(?:shortcut )?icon"[^>]*>', '', source)
          source = re.sub(r'\s*<link rel="apple-touch-icon(?:-precomposed)?"[^>]*>', '', source)
          source = source.replace(
              '<title>Note</title>',
              '''<title>Note</title>\n  <link rel="manifest" href="/To-Do/app-v13/manifest.webmanifest">\n  <link rel="apple-touch-icon" href="/To-Do/app-v13/apple-touch-icon.png">\n  <link rel="apple-touch-icon-precomposed" href="/To-Do/app-v13/apple-touch-icon-precomposed.png">\n  <link rel="icon" type="image/png" sizes="192x192" href="/To-Do/app-v13/icon-192.png">\n  <link rel="icon" type="image/png" sizes="512x512" href="/To-Do/app-v13/icon-512.png">\n  <link rel="shortcut icon" href="/To-Do/app-v13/favicon.ico">''',
              1
          )
          if 'name="mobile-web-app-capable"' not in source:
              source = source.replace(
                  '<meta name="apple-mobile-web-app-capable" content="yes">',
                  '<meta name="apple-mobile-web-app-capable" content="yes">\n  <meta name="mobile-web-app-capable" content="yes">',
                  1
              )
          (outdir/'index.html').write_text(source, encoding='utf-8')

          (outdir/'manifest.webmanifest').write_text('''{
            "id": "/To-Do/app-v13/",
            "name": "Note",
            "short_name": "Note",
            "start_url": "/To-Do/app-v13/",
            "scope": "/To-Do/app-v13/",
            "display": "standalone",
            "background_color": "#9fd8ff",
            "theme_color": "#5cb1fa",
            "icons": [
              {"src":"./icon-192.png","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"./icon-512.png","sizes":"512x512","type":"image/png","purpose":"any"}
            ]
          }
          ''', encoding='utf-8')

          # Controllo che la pagina nuova punti solo alle icone nuove.
          final = (outdir/'index.html').read_text(encoding='utf-8')
          assert '/To-Do/app-v13/apple-touch-icon.png' in final
          assert '/To-Do/app-v13/manifest.webmanifest' in final
          print('APP V13 READY')
          PY

      - name: Carica sito
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
