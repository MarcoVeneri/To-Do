name: Build v15 inline iOS icon

on:
  push:
    paths:
      - ".github/workflows/build-v15-inline-icon.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build v15 with embedded touch icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, re, json

          src = Path('app-v14/index.html').read_text(encoding='utf-8')
          icon = Path('app-v14/apple-touch-icon-180.png').read_bytes()
          data_uri = 'data:image/png;base64,' + base64.b64encode(icon).decode('ascii')

          # Remove every network-based Apple touch icon so iOS has exactly one source.
          src = re.sub(r'\s*<link rel="apple-touch-icon"[^>]*>', '', src)
          src = re.sub(r'\s*<link rel="apple-touch-icon-precomposed"[^>]*>', '', src)
          src = src.replace('/To-Do/app-v14/manifest.webmanifest', '/To-Do/app-v15/manifest.webmanifest')

          marker = '<title>Note</title>'
          embedded = f'{marker}\n  <link rel="apple-touch-icon" sizes="180x180" href="{data_uri}">'
          src = src.replace(marker, embedded, 1)

          out = Path('app-v15')
          out.mkdir(exist_ok=True)
          (out/'index.html').write_text(src, encoding='utf-8')
          (out/'manifest.webmanifest').write_text(json.dumps({
              'id':'/To-Do/app-v15/',
              'name':'Note',
              'short_name':'Note',
              'start_url':'/To-Do/app-v15/',
              'scope':'/To-Do/app-v15/',
              'display':'standalone',
              'background_color':'#9fd8ff',
              'theme_color':'#5cb1fa'
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          final = (out/'index.html').read_text(encoding='utf-8')
          assert final.count('rel="apple-touch-icon"') == 1
          assert 'data:image/png;base64,' in final
          assert 'TRUNCATED_FOR_REWRITE' not in final
          assert len(data_uri) > 10000
          print('v15 ready; inline icon chars:', len(data_uri))
          PY

      - name: Commit v15
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app-v15
          git commit -m "Fix iOS 27.2 Home icon with inline PNG" || exit 0
          git push
